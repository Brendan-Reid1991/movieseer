include:
  - services/jellyseerr.yml

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT}:8096"
    volumes:
      - ./services/config/jellyfin:/config
      - ./services/config/jellyfin/cache:/cache
    networks:
      - movieseer

  movieseer:
    build:
      context: ./movieseer
    container_name: movieseer
    restart: unless-stopped
    ports:
      - "${MOVIESEER_PORT}:8099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JELLYSEERR_URL=http://jellyseerr:5055
      - JELLYSEERR_API_KEY=${JELLYSEERR_API_KEY}
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - HOST_IP=${HOST_IP}
      - JELLYFIN_PORT=${JELLYFIN_PORT}
      - JELLYSEERR_PORT=${JELLYSEERR_PORT}
    networks:
      - movieseer

networks:
  movieseer:
    driver: bridge
