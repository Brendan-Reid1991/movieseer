<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f17;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      padding: 10px;
      min-height: 100vh;
    }

    /* ── system bar ── */
    .system-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #1a1a2a;
      border-radius: 8px;
      border: 1px solid #2a2a3a;
    }
    .system-bar .label { color: #64748b; margin-right: 2px; }

    /* ── cards ── */
    .card {
      background: #1a1a2a;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 7px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 7px;
      gap: 8px;
    }
    .card-title {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta { color: #64748b; font-size: 11px; white-space: nowrap; flex-shrink: 0; }

    /* ── pipeline row ── */
    .pipeline {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .arrow { color: #334155; font-size: 11px; }

    /* ── pills ── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }
    .pill.ok      { background: #14532d; color: #86efac; }
    .pill.info    { background: #1e3a5f; color: #93c5fd; }
    .pill.warn    { background: #431407; color: #fdba74; }
    .pill.err     { background: #450a0a; color: #fca5a5; }
    .pill.muted   { background: #1e293b; color: #64748b; border: 1px solid #334155; }
    .pill.badge        { background: #1e3a8a; color: #93c5fd; font-size: 10px; padding: 1px 5px; }
    .pill.badge.tv     { background: #14532d; color: #86efac; }
    .pill.badge.direct { background: #312e81; color: #a5b4fc; }

    /* ── progress bar ── */
    .progress-wrap { margin-top: 6px; }
    .progress-bar {
      height: 3px;
      background: #1e293b;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .progress-label { color: #64748b; font-size: 10px; margin-top: 2px; }

    /* ── error / history ── */
    .error-msg { color: #fca5a5; font-size: 11px; margin-top: 5px; }
    .history { margin-top: 6px; border-top: 1px solid #2a2a3a; padding-top: 5px; }
    .history-item { color: #64748b; font-size: 11px; }
    .history-item.failed { color: #f87171; }

    /* ── empty / error states ── */
    .empty { color: #475569; padding: 16px; text-align: center; }
    .load-error { color: #f87171; padding: 16px; text-align: center; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"><div class="empty">Loading…</div></div>

  <script>
    const STATUS_COLORS = {
      available: 'ok', imported: 'ok', ok: 'ok',
      grabbed: 'info', downloading: 'info', approved: 'info', processing: 'info',
      warning: 'warn', partial: 'warn',
      failed: 'err', error: 'err', declined: 'err',
      pending: 'muted', searching: 'muted', unknown: 'muted', ignored: 'muted',
    };

    const STATUS_ICONS = {
      available: '✓', imported: '✓', ok: '✓',
      grabbed: '↓', downloading: '↓', approved: '✓',
      warning: '⚠', partial: '~',
      failed: '✗', error: '✗', declined: '✗',
      pending: '⏳', searching: '…',
    };

    function color(status) { return STATUS_COLORS[status] || 'muted'; }
    function icon(status)  { return STATUS_ICONS[status]  || '?'; }

    function pill(label, status, extra) {
      const cls = color(status);
      const ic  = icon(status);
      const txt = extra ? `${label}: ${ic} ${extra}` : `${label}: ${ic} ${status}`;
      return `<span class="pill ${cls}">${txt}</span>`;
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diff = Date.now() - new Date(dateStr).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1)  return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      return `${Math.floor(h / 24)}d ago`;
    }

    function renderSystem(sys) {
      const parts = [];

      const pr = sys.prowlarr;
      if (pr && !pr.error) {
        const st = pr.failing > 0 ? 'warn' : 'ok';
        const lbl = pr.failing > 0 ? `${pr.healthy}/${pr.total} ⚠` : `${pr.healthy}/${pr.total} ✓`;
        parts.push(`<span class="pill ${st}"><span class="label">Prowlarr </span>${lbl}</span>`);
      } else if (pr && pr.error) {
        parts.push(`<span class="pill err"><span class="label">Prowlarr </span>unreachable</span>`);
      }

      const sab = sys.sabnzbd;
      if (sab && !sab.error) {
        const st = sab.paused ? 'warn' : (sab.count > 0 ? 'info' : 'muted');
        const lbl = sab.paused ? 'paused' : (sab.count > 0 ? `${sab.count} active · ${sab.speed}` : 'idle');
        parts.push(`<span class="pill ${st}"><span class="label">SABnzbd </span>${lbl}</span>`);
      }

      const qb = sys.qbittorrent;
      if (qb && !qb.error) {
        const st = qb.active > 0 ? 'info' : 'muted';
        const lbl = qb.active > 0 ? `${qb.active} active` : 'idle';
        parts.push(`<span class="pill ${st}"><span class="label">qBT </span>${lbl}</span>`);
      }

      return `<div class="system-bar">${parts.join('')}</div>`;
    }

    function renderRequest(req) {
      const { type, title, requested_by, requested_at, jellyseerr_status, arr, download, history } = req;
      const arrLabel = type === 'tv' ? 'Sonarr' : 'Radarr';

      // Pipeline hops
      const hops = [];
      if (req.source === 'jellyseerr') {
        hops.push(pill('Jellyseerr', jellyseerr_status));
        hops.push(`<span class="arrow">→</span>`);
      } else {
        hops.push(`<span class="pill badge direct">direct</span>`);
        hops.push(`<span class="arrow">→</span>`);
      }

      if (arr) {
        const st = arr.status;
        const extra = arr.episodes_queued ? `downloading (${arr.episodes_queued} eps)` : null;
        hops.push(pill(arrLabel, st, extra));
      } else {
        hops.push(pill(arrLabel, 'unknown'));
      }

      let progressHtml = '';
      if (download) {
        hops.push(`<span class="arrow">→</span>`);
        const st = download.error ? 'error' : (download.progress >= 100 ? 'ok' : 'downloading');
        const dlLabel = download.error
          ? download.error.substring(0, 60)
          : (download.progress != null ? `${download.progress}%` : download.status);
        hops.push(pill(download.client || 'DL', st, dlLabel));

        if (download.progress != null && !download.error && download.progress < 100) {
          const eta = download.eta ? ` · ETA ${download.eta}` : '';
          progressHtml = `
            <div class="progress-wrap">
              <div class="progress-bar"><div class="progress-fill" style="width:${download.progress}%"></div></div>
              <div class="progress-label">${download.progress}%${eta} via ${download.client || 'unknown client'}</div>
            </div>`;
        }
      }

      // Errors
      let errorHtml = '';
      if (arr && arr.error) errorHtml += `<div class="error-msg">⚠ ${arr.error}</div>`;
      if (download && download.error) errorHtml += `<div class="error-msg">⚠ ${download.error}</div>`;

      // History
      let historyHtml = '';
      if (history && history.length > 0) {
        const items = history.map(h => {
          const failed = h.event && h.event.toLowerCase().includes('fail');
          const cls = failed ? 'history-item failed' : 'history-item';
          const when = timeAgo(h.at);
          const msg = h.error ? ` — ${h.error}` : (h.source ? ` — ${h.source}` : '');
          return `<div class="${cls}">${h.event}${msg} <span style="opacity:0.5">${when}</span></div>`;
        }).join('');
        historyHtml = `<div class="history">${items}</div>`;
      }

      return `
        <div class="card">
          <div class="card-header">
            <span class="card-title">
              ${title}
              <span class="pill badge ${type}">${type}</span>
            </span>
            <span class="card-meta">by ${requested_by} · ${timeAgo(requested_at)}</span>
          </div>
          <div class="pipeline">${hops.join('')}</div>
          ${progressHtml}
          ${errorHtml}
          ${historyHtml}
        </div>`;
    }

    function render(data) {
      const { system, requests } = data;
      let html = renderSystem(system);
      if (!requests || requests.length === 0) {
        html += '<div class="empty">No recent requests</div>';
      } else {
        html += requests.map(renderRequest).join('');
      }
      document.getElementById('root').innerHTML = html;
    }

    async function refresh() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (e) {
        document.getElementById('root').innerHTML =
          `<div class="load-error">Failed to load status: ${e.message}</div>`;
      }
    }

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
