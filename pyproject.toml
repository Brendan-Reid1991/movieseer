[project]
name = "movieseer"
version = "0.1.0"
description = "An in-house media server using the *arr stack, Jellyfin and a bespoke dashboard."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Brendan Reid" }]
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
  "fastapi>=0.111",
  "docker>=7.0",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.20",
  "ruff>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["movieseer"]