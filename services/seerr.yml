services:
  seerr:
    image: seerr/seerr
    container_name: seerr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${SEERR_PORT}:5055"
    volumes:
      - ./config/seerr:/app/config
    depends_on:
       sonarr:
        condition: service_healthy
       radarr:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3