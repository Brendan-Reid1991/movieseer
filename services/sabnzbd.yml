services:
  sabnzbd:
    image: linuxserver/sabnzbd
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "${SABNZBD_PORT}:8080"
    volumes:
      - ${SABNZBD_INCOMPLETE}:/incomplete
      - ${MEDIA_PATH}:/media
      - ./config/sabnzbd:/config    
    depends_on:
       plex:
        condition: service_healthy