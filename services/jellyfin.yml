services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT}:8096"
    volumes:
      - ./config/jellyfin:/config
      - ./config/jellyfin/cache:/cache
      - ${DATA_PATH}:/media
      - ${PRIVATE_PATH}:/private
    networks:
      - movieseer

networks:
  movieseer:
    external: true
