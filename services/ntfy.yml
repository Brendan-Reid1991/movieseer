services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command: serve
    restart: unless-stopped
    ports:
      - "${NTFY_PORT}:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
    networks:
      - movieseer

networks:
  movieseer:
    external: true

volumes:
  ntfy_cache:
