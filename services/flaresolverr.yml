services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "${FLARESOLVERR_PORT}:8191"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fS --max-time 4 http://127.0.0.1:8191 | grep -Fq "FlareSolverr is ready!"
      timeout: 5s
      interval: 6s
      retries: 3
      start_period: 5s