services:
  plex:
    image: plexinc/pms-docker
    container_name: plex
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
      - ADVERTISE_IP=http://${HOST_IP}:${PLEX_PORT}/
      - PLEX_CLAIM=${PLEX_CLAIM}
    ports:
      - "${PLEX_PORT}:32400"
    volumes:
      - ./config/plex:/config
      - ${MEDIA_PATH}:/${MEDIA_MOUNT}
    depends_on:
       seerr:
        condition: service_healthy
