services:
  plex:
    image: plexinc/pms-docker
    container_name: plex
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PLEX_UID=${PUID}
      - PLEX_GID=${PGID}
      - ADVERTISE_IP=http://${HOST_IP}:${PLEX_PORT}/
    ports:
      - "${PLEX_PORT}:32400"
    volumes:
      - ./config/plex:/config
      - plex_transcode:/transcode
      - ${DATA_PATH}:/media
    networks:
      - movieseer

networks:
  movieseer:
    external: true

volumes:
  plex_transcode:
