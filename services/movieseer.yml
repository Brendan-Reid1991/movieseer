services:
  movieseer:
    build:
      context: ..
    container_name: movieseer
    restart: unless-stopped
    ports:
      - "${MOVIESEER_PORT}:8099"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}:${MEDIA_MOUNT}:ro
      - ${LOG_PATH}:/var/log/movieseer
    env_file:
      - ../.env
    environment:
      # Port values here are the internal listening ports
      # of the respective services - set by the containers.   
      - SEERR_URL=http://seerr:5055
      - RADARR_URL=http://radarr:7878
      - SONARR_URL=http://sonarr:8989
      - PROWLARR_URL=http://prowlarr:9696
      - SABNZBD_URL=http://sabnzbd:8080
      - LOG_FILE=/var/log/movieseer/app.log
    networks:
      - movieseer

networks:
  movieseer:
    external: true
