services:
  pipeline-status:
    build:
      context: ../scripts/pipeline-status
    container_name: pipeline-status
    restart: unless-stopped
    ports:
      - "${PIPELINE_STATUS_PORT}:8099"
    environment:
      - JELLYSEERR_URL=http://jellyseerr:5055
      - JELLYSEERR_API_KEY=${HOMEPAGE_VAR_JELLYSEERR_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${HOMEPAGE_VAR_RADARR_API_KEY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${HOMEPAGE_VAR_SONARR_API_KEY}
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=${HOMEPAGE_VAR_PROWLARR_API_KEY}
      - SABNZBD_URL=http://sabnzbd:8080
      - SABNZBD_API_KEY=${HOMEPAGE_VAR_SABNZBD_API_KEY}
      - QBITTORRENT_URL=http://gluetun:8080
      - QBITTORRENT_USER=${HOMEPAGE_VAR_QBIT_USER}
      - QBITTORRENT_PASS=${HOMEPAGE_VAR_QBIT_PASS}
      - NTFY_URL=http://ntfy:80
      - NTFY_TOPIC=movieseer
    networks:
      - movieseer

networks:
  movieseer:
    external: true
