services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_ALLOWED_HOSTS=*
      - HOMEPAGE_VAR_HOST=${HOMEPAGE_VAR_HOST}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${HOMEPAGE_VAR_JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_JELLYSEERR_API_KEY=${HOMEPAGE_VAR_JELLYSEERR_API_KEY}
      - HOMEPAGE_VAR_SONARR_API_KEY=${HOMEPAGE_VAR_SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${HOMEPAGE_VAR_RADARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_EXTRA_API_KEY=${HOMEPAGE_VAR_RADARR_EXTRA_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${HOMEPAGE_VAR_PROWLARR_API_KEY}
      - HOMEPAGE_VAR_QBIT_USER=${HOMEPAGE_VAR_QBIT_USER}
      - HOMEPAGE_VAR_QBIT_PASS=${HOMEPAGE_VAR_QBIT_PASS}
    ports:
      - "${HOMEPAGE_PORT}:3000"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_PATH}:/media:ro
    networks:
      - movieseer

networks:
  movieseer:
    external: true
